<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yuval Trucking Rental System</title>
<style>
:root{--bg:#f7f2ec;--card:#fff;--tx:#1d1a17;--mu:#7a6f66;--bd:#e8dfd5;--ac:#ea5a1f;--sb:#14110f;--ok:#1f9d55;--bad:#d64545;--wa:#c98a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#100e0d;--card:#1b1816;--tx:#f1ebe4;--mu:#a69b91;--bd:#332d28;--sb:#0a0807}}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
nav{width:220px;background:var(--sb);color:#cfd8e3;padding:14px 8px;flex-shrink:0;overflow-y:auto}
nav h1{font-size:16px;color:#fff;margin:0 8px 12px}nav h1 span{color:var(--ac)}
nav a{display:block;padding:9px 12px;border-radius:6px;cursor:pointer;color:inherit}nav a:hover{background:#ffffff14}nav a.on{background:var(--ac);color:#fff}
main{flex:1;min-width:0;padding:16px}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
h2{margin:0;font-size:20px}
select,input{padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);font:inherit;width:100%}
.top select,.top input{width:auto}
button{padding:8px 12px;border:0;border-radius:6px;background:var(--ac);color:#fff;cursor:pointer;font:inherit}button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--bad)}button.s{padding:4px 8px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
.card small{color:var(--mu)}.card b{display:block;font-size:22px;margin-top:4px}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:560px}th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:12px;text-transform:uppercase}
.b{padding:2px 8px;border-radius:10px;font-size:12px;background:#8883;display:inline-block}.b.ok{background:#1f9d5528;color:var(--ok)}.b.bad{background:#d6454528;color:var(--bad)}.b.wa{background:#c98a0028;color:var(--wa)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0}.bar i{display:block;height:14px;background:var(--ac);border-radius:4px}.bar span{width:110px;color:var(--mu);font-size:12px}
.al{padding:8px 10px;border-left:3px solid var(--wa);background:#c98a0014;margin:6px 0;border-radius:4px}.al.r{border-color:var(--bad);background:#d6454514}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(440px,94vw);padding:18px}dialog::backdrop{background:#0008}dialog{max-height:90vh;overflow:auto}
.paper{background:#fff;color:#000;border:1px solid var(--bd);border-radius:6px;padding:22px;max-width:860px;margin:0 auto;font-size:13px;line-height:1.5}.qi{font:inherit;color:#000;background:transparent;border:0;border-bottom:1px dashed #aaa;border-radius:0;padding:1px 2px;width:auto}.paper textarea.qi{border:1px dashed #ccc;resize:vertical;overflow:hidden;padding:4px}
@media print{.np{display:none!important}.paper{border:0;padding:0;max-width:none}.qi{border:0!important}main{padding:0}}
label{display:block;margin:8px 0 3px;color:var(--mu);font-size:12px}
@media(max-width:720px){body{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;padding:8px}nav h1{display:none}nav a{white-space:nowrap}}
@media print{nav,.top button,.top select,.top input,td:last-child,th:last-child{display:none}}

:root{--g:linear-gradient(135deg,#e5342b 0%,#f2711c 55%,#ffb81f 100%)}
body{font-family:Inter,system-ui,"Segoe UI",Arial,sans-serif}
h2,.brand b,.hero h1,.card b{font-family:"Barlow Condensed",Inter,system-ui,sans-serif}
h2{font-size:26px;letter-spacing:.4px;text-transform:uppercase}
nav{background:#14110f;border-right:3px solid #e5342b}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;margin-bottom:8px;border-bottom:1px solid #ffffff1f}.brand img{width:64px;height:64px;border-radius:12px;background:#fff;object-fit:cover;flex-shrink:0}.brand b{display:block;color:#fff;font-size:23px;letter-spacing:.6px;line-height:1}.brand small{color:#ffb81f;font-size:10px;letter-spacing:1.6px;text-transform:uppercase}
nav a{border-radius:8px;margin:2px 0;color:#d9d2c9;transition:.15s}nav a:hover{background:#ffffff14;color:#fff}nav a.on{background:var(--g);color:#fff;font-weight:600;box-shadow:0 4px 14px #e5342b55}
button{background:var(--g);font-weight:600;box-shadow:0 2px 8px #e5342b33}button.g{background:transparent;box-shadow:none}button.d{background:#d64545;box-shadow:none}
input:focus,select:focus,textarea:focus{outline:2px solid #f2711c44;border-color:#f2711c}
.card{border-radius:14px;box-shadow:0 1px 3px #0000000d,0 8px 24px #0000000a}
.grid .card{position:relative;overflow:hidden;padding-top:18px}.grid .card:before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--g)}
.card b{font-size:32px;letter-spacing:.3px;line-height:1.1}
.wrap{border-radius:14px;box-shadow:0 1px 3px #0000000d,0 8px 24px #0000000a}
th{background:var(--bg);letter-spacing:.6px}tr:hover td{background:#f2711c0d}
.hero{background:linear-gradient(120deg,#14110f 0%,#2a1511 55%,#8a2016 100%);color:#fff;border-radius:16px;padding:18px 24px;margin-bottom:14px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:4px solid #f2711c}.hero h1{margin:0;font-size:36px;letter-spacing:.6px;text-transform:uppercase}.hero p{margin:4px 0 0;color:#ffd9a0;font-size:13px}.hero img{height:68px;border-radius:12px;background:#fff}
@media(max-width:720px){.brand{display:none}.hero h1{font-size:26px}}
@media print{.hero,.brand{display:none}}
label.g{display:inline-block;margin:0;color:var(--tx);font-size:14px;background:transparent}
.paper.pp{border:0}.paper.pp .qi{border:0!important}
.leaflet-control-layers input{width:auto;padding:0}.leaflet-container{font:inherit}

main{padding:20px 26px;max-width:1500px}
main>.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 82%,transparent);padding:8px 0 12px;margin-bottom:6px}
.grid .card{transition:.2s}.grid .card:hover{transform:translateY(-2px);box-shadow:0 10px 28px #0000001a}
td{padding:12px 14px}tr:nth-child(even) td{background:#00000004}
.b{font-weight:600;padding:3px 10px}
input,select,textarea{border-radius:10px;padding:10px 12px}button{border-radius:10px;padding:9px 14px}button.s{padding:5px 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.chip{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:999px;box-shadow:none;padding:6px 14px;font-weight:500}.chip b{font-size:inherit;font-family:inherit;margin:0;display:inline;color:var(--ac)}
.chip.on{background:var(--g);color:#fff;border-color:transparent}.chip.on b{color:#fff}
#mbar{display:none}
@media(max-width:900px){
body{flex-direction:column}
#mbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;background:#14110f;color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:3px solid #e5342b}
#mbar button{background:none;box-shadow:none;font-size:28px;line-height:1;padding:2px 8px;color:#fff}
#mbar img{height:34px;border-radius:8px;background:#fff}#mbar b{font-family:"Barlow Condensed",Inter,sans-serif;font-size:21px;letter-spacing:.5px;text-transform:uppercase}
nav{position:fixed;top:0;left:0;bottom:0;width:272px;max-width:82vw;display:block;overflow-y:auto;transform:translateX(-105%);transition:transform .25s;z-index:100;padding:14px 10px}
nav .brand{display:flex!important}
body.menu nav{transform:none;box-shadow:0 0 40px #000a}
#ov{display:none;position:fixed;inset:0;background:#0009;z-index:90}body.menu #ov{display:block}
main{padding:12px}
main>.top{position:static;flex-direction:column;align-items:stretch}main>.top h2{display:none}
main>.top>div{width:100%}main>.top input,main>.top select{flex:1;min-width:0;width:100%}
nav a{white-space:normal;padding:13px 14px;font-size:15px}
.grid{grid-template-columns:repeat(2,1fr)}.card b{font-size:26px}
th,td{padding:9px 10px}}
@media(max-width:480px){.hero h1{font-size:24px}.hero img{display:none}}
@media print{#mbar,#ov{display:none!important}}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-bottom:18px}
.fcard{background:var(--card);border:1px solid var(--bd);border-top:5px solid #b9b0a6;border-radius:14px;padding:14px;box-shadow:0 1px 3px #0000000d,0 8px 24px #0000000a;display:flex;flex-direction:column;gap:10px;transition:.2s}.fcard:hover{transform:translateY(-2px)}
.fcard.on{border-top-color:#1f9d55}.fcard.bd{border-top-color:#d64545}.fcard.sb{border-top-color:#c98a00}
.fh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.fh b{font-family:"Barlow Condensed",Inter,sans-serif;font-size:22px;line-height:1.1;display:block}.fh small,.fo small{color:var(--mu);display:block;font-size:12px}
.fo{display:flex;gap:10px;align-items:center;padding:8px;background:var(--bg);border-radius:10px}.fo>div:not(.av){flex:1;min-width:0}.fo img,.fo .av{width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0}.fo .av{display:grid;place-items:center;background:var(--bd);font-weight:700}
.fr{display:flex;flex-wrap:wrap;gap:6px}.fr span{background:var(--bg);border-radius:8px;padding:3px 9px;font-size:12px}
.sec{font-family:"Barlow Condensed",Inter,sans-serif;font-size:24px;text-transform:uppercase;letter-spacing:.5px;margin:8px 0 10px}.sec small{color:var(--mu);font-size:15px}
.pm{width:44px;height:44px;border-radius:50%;border:4px solid #2f7de1;background:#fff;overflow:hidden;display:grid;place-items:center;font-weight:700;box-shadow:0 2px 8px #0006}.pm img{width:100%;height:100%;object-fit:cover}
.sci{padding:5px 6px;font-size:12px;border-radius:8px}
.slip{background:#fff;color:#000;border:1px solid var(--bd);border-radius:10px;padding:22px 26px;max-width:794px;margin:0 auto 16px;font-size:13px;line-height:1.45}
.sh{display:flex;align-items:center;gap:12px;border-bottom:3px solid #e5342b;padding-bottom:10px}.sh img{height:64px;border-radius:8px}.sh .sn{font-family:"Barlow Condensed",Inter,sans-serif;font-size:30px;font-weight:700;line-height:1}.sh .ss{font-size:11px;color:#555}.sh .st{margin-left:auto;font-family:"Barlow Condensed",Inter,sans-serif;font-size:30px;letter-spacing:2px;color:#e5342b}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin:12px 0}
.slip table{min-width:0;width:100%;border-collapse:collapse}.slip th,.slip td{border:1px solid #ccc;padding:5px 8px;background:#fff!important;color:#000;white-space:normal;font-size:12px}.slip th{background:#f3eee8!important}
.sx{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:12px}.sx div{border:1px solid #ccc;border-radius:8px;padding:6px 10px}.sx span{display:block;font-size:11px;color:#555}.sx b{font-size:15px;font-family:inherit}.sx .net{background:#fde7e3;border-color:#e5342b}.sx .net b{font-size:19px}
.sig{display:flex;justify-content:space-between;gap:24px;margin-top:34px;font-size:12px}
@media print{main>.top{display:none!important}.slip{border:0;border-radius:0;box-shadow:none;margin:0;max-width:none;padding:0;break-after:page;page-break-after:always}.slip td:last-child,.slip th:last-child{display:table-cell!important}}
.so{padding:9px 12px;color:#9a8f85;cursor:pointer;font-size:13px;margin-top:14px;border-top:1px solid #ffffff22}.so:hover{color:#fff}
.sitec{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:16px;overflow:hidden;box-shadow:0 1px 3px #0000000d,0 8px 24px #0000000a}
.sth{display:flex;justify-content:space-between;gap:12px;padding:16px 18px;background:linear-gradient(120deg,#14110f,#2a1511 60%,#8a2016);color:#fff;flex-wrap:wrap}
.stc{font-family:"Barlow Condensed",Inter,sans-serif;font-size:32px;text-transform:uppercase;line-height:1.05;letter-spacing:.4px}.sti{color:#ffd9a0;font-size:13px;margin-top:3px}
.stb{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;padding:16px 18px}.stb h4{margin:0 0 8px;font-size:14px}
.stb .fo{margin-bottom:6px}.stb .fr{justify-content:space-between;align-items:center;background:var(--bg);border-radius:8px;padding:6px 10px}
</style>

function del(id){const r=db[cur].find(x=>x.id==id);$("#cm").textContent='Delete "'+(r?r[M[cur].m]:"")+'"? This cannot be undone.';$("#cy").onclick=()=>{if(cur=="stock")stockFx(r,-1);db[cur]=db[cur].filter(x=>x.id!=id);save();$("#cd").close();go();toast("Deleted")};$("#cd").showModal()}

 const o=edit?db[cur].find(x=>x.id==edit):{id:Date.now()};const _old=cur=="stock"&&edit?{...o}:null;const _pt=o.tin+"|"+o.tout,_ph=o.hrs;
 M[cur].f.forEach(f=>{if(f[2]=="i"||f[2]=="im"){o[f[0]]=tmp[f[0]];return}let v=$("#frm").elements[f[0]].value;if(f[2]=="n")v=+v||0;else if(f[2]=="r")v=+v;o[f[0]]=v});
 if(cur=="attendance"&&o.tin&&o.tout&&(!o.hrs||(edit&&o.hrs==_ph&&_pt!=o.tin+"|"+o.tout))){const h=s=>+s.slice(0,2)+s.slice(3,5)/60;let d=h(o.tout)-h(o.tin);if(d<0)d+=24;o.hrs=Math.round(d*100)/100;if(!o.ot&&o.hrs>8)o.ot=Math.round((o.hrs-8)*100)/100}
 if(!edit)db[cur].push(o);

 if(cur=="employees"){const f=db.fleet.find(x=>x.id==o.equip),s=f&&db.sites.find(x=>x.id==f.site);if(s)o.place=s.name}
 if(cur=="fleet"){const v=$("#frm").elements["__op"].value;db.employees.forEach(e=>{if(e.equip==o.id&&e.id!=v)e.equip=0});if(v){const e=db.employees.find(x=>x.id==v);if(e)e.equip=o.id}{const s=db.sites.find(x=>x.id==o.site);if(s)db.employees.forEach(e=>{if(e.equip==o.id)e.place=s.name})}}
 if(cur=="rentals"&&o.stage=="Active"){const e=db.fleet.find(x=>x.id==o.equip);if(e)e.status="Rented"}
 if(cur=="rentals"&&o.stage=="Returned"){const e=db.fleet.find(x=>x.id==o.equip);if(e)e.status="Available"}
 save();$("#dlg").close();go()};
