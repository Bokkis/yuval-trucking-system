<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yuval Trucking Rental System</title>
<style>
:root{--bg:#f7f2ec;--card:#fff;--tx:#1d1a17;--mu:#7a6f66;--bd:#e8dfd5;--ac:#ea5a1f;--sb:#14110f;--ok:#1f9d55;--bad:#d64545;--wa:#c98a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#100e0d;--card:#1b1816;--tx:#f1ebe4;--mu:#a69b91;--bd:#332d28;--sb:#0a0807}}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
nav{width:220px;background:var(--sb);color:#cfd8e3;padding:14px 8px;flex-shrink:0;overflow-y:auto}
nav h1{font-size:16px;color:#fff;margin:0 8px 12px}nav h1 span{color:var(--ac)}
nav a{display:block;padding:9px 12px;border-radius:6px;cursor:pointer;color:inherit}nav a:hover{background:#ffffff14}nav a.on{background:var(--ac);color:#fff}
main{flex:1;min-width:0;padding:16px}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
h2{margin:0;font-size:20px}
select,input{padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);font:inherit;width:100%}
.top select,.top input{width:auto}
button{padding:8px 12px;border:0;border-radius:6px;background:var(--ac);color:#fff;cursor:pointer;font:inherit}button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--bad)}button.s{padding:4px 8px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
.card small{color:var(--mu)}.card b{display:block;font-size:22px;margin-top:4px}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:560px}th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:12px;text-transform:uppercase}
.b{padding:2px 8px;border-radius:10px;font-size:12px;background:#8883;display:inline-block}.b.ok{background:#1f9d5528;color:var(--ok)}.b.bad{background:#d6454528;color:var(--bad)}.b.wa{background:#c98a0028;color:var(--wa)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0}.bar i{display:block;height:14px;background:var(--ac);border-radius:4px}.bar span{width:110px;color:var(--mu);font-size:12px}
.al{padding:8px 10px;border-left:3px solid var(--wa);background:#c98a0014;margin:6px 0;border-radius:4px}.al.r{border-color:var(--bad);background:#d6454514}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(440px,94vw);padding:18px}dialog::backdrop{background:#0008}dialog{max-height:90vh;overflow:auto}
.paper{background:#fff;color:#000;border:1px solid var(--bd);border-radius:6px;padding:22px;max-width:860px;margin:0 auto;font-size:13px;line-height:1.5}.qi{font:inherit;color:#000;background:transparent;border:0;border-bottom:1px dashed #aaa;border-radius:0;padding:1px 2px;width:auto}.paper textarea.qi{border:1px dashed #ccc;resize:vertical;overflow:hidden;padding:4px}
@media print{.np{display:none!important}.paper{border:0;padding:0;max-width:none}.qi{border:0!important}main{padding:0}}
label{display:block;margin:8px 0 3px;color:var(--mu);font-size:12px}
@media(max-width:720px){body{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;padding:8px}nav h1{display:none}nav a{white-space:nowrap}}
@media print{nav,.top button,.top select,.top input,td:last-child,th:last-child{display:none}}

:root{--g:linear-gradient(135deg,#e5342b 0%,#f2711c 55%,#ffb81f 100%)}
body{font-family:Inter,system-ui,"Segoe UI",Arial,sans-serif}
h2,.brand b,.hero h1,.card b{font-family:"Barlow Condensed",Inter,system-ui,sans-serif}
h2{font-size:26px;letter-spacing:.4px;text-transform:uppercase}
nav{background:#14110f;border-right:3px solid #e5342b}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;margin-bottom:8px;border-bottom:1px solid #ffffff1f}.brand img{width:64px;height:64px;border-radius:12px;background:#fff;object-fit:cover;flex-shrink:0}.brand b{display:block;color:#fff;font-size:23px;letter-spacing:.6px;line-height:1}.brand small{color:#ffb81f;font-size:10px;letter-spacing:1.6px;text-transform:uppercase}
nav a{border-radius:8px;margin:2px 0;color:#d9d2c9;transition:.15s}nav a:hover{background:#ffffff14;color:#fff}nav a.on{background:var(--g);color:#fff;font-weight:600;box-shadow:0 4px 14px #e5342b55}
button{background:var(--g);font-weight:600;box-shadow:0 2px 8px #e5342b33}button.g{background:transparent;box-shadow:none}button.d{background:#d64545;box-shadow:none}
input:focus,select:focus,textarea:focus{outline:2px solid #f2711c44;border-color:#f2711c}
.card{border-radius:14px;box-shadow:0 1px 3px #0000000d,0 8px 24px #0000000a}
.grid .card{position:relative;overflow:hidden;padding-top:18px}.grid .card:before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--g)}
.card b{font-size:32px;letter-spacing:.3px;line-height:1.1}
.wrap{border-radius:14px;box-shadow:0 1px 3px #0000000d,0 8px 24px #0000000a}
th{background:var(--bg);letter-spacing:.6px}tr:hover td{background:#f2711c0d}
.hero{background:linear-gradient(120deg,#14110f 0%,#2a1511 55%,#8a2016 100%);color:#fff;border-radius:16px;padding:18px 24px;margin-bottom:14px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:4px solid #f2711c}.hero h1{margin:0;font-size:36px;letter-spacing:.6px;text-transform:uppercase}.hero p{margin:4px 0 0;color:#ffd9a0;font-size:13px}.hero img{height:68px;border-radius:12px;background:#fff}
@media(max-width:720px){.brand{display:none}.hero h1{font-size:26px}}
@media print{.hero,.brand{display:none}}
label.g{display:inline-block;margin:0;color:var(--tx);font-size:14px;background:transparent}
.paper.pp{border:0}.paper.pp .qi{border:0!important}
.leaflet-control-layers input{width:auto;padding:0}.leaflet-container{font:inherit}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body>
<nav id="nav"></nav>
<main>
 <div class="top"><h2 id="ttl"></h2>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
   
   <input id="q" placeholder="Search...">
   <button id="add">+ Add</button><button class="g" onclick="print()">Print</button><button class="g" onclick="logout()">Sign out</button>
  </div></div>
 <div id="view"></div>
</main>
<div id="login" style="position:fixed;inset:0;background:#14110f;display:grid;place-items:center;z-index:200;padding:16px"><div style="background:#fff;color:#1d1a17;border-radius:16px;padding:26px;width:min(380px,100%);text-align:center"><img src="${LOGO}" id="llogo" style="width:110px;border-radius:12px"><h2 style="margin:8px 0 14px">Yuval Trucking</h2><input id="lem" type="email" placeholder="Email" style="margin-bottom:8px;color:#1d1a17"><input id="lpw" type="password" placeholder="Password" style="margin-bottom:12px;color:#1d1a17" onkeydown="if(event.key=='Enter')doLogin()"><button onclick="doLogin()" style="width:100%">Sign in</button><p id="lmsg" style="color:#d64545;font-size:13px;min-height:18px"></p></div></div>
<dialog id="dlg"><form id="frm" onsubmit="return false"><h3 id="dt" style="margin-top:0"></h3><div id="ff"></div>
 <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button type="button" class="g" id="cx">Cancel</button><button type="button" id="sv">Save</button></div></form></dialog>
<dialog id="cd"><p id="cm" style="margin-top:0"></p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="g" onclick="$('#cd').close()">Cancel</button><button class="d" id="cy">Delete</button></div></dialog>
